services:

  web:
    image: rakshanda56115/mid-app:56115
    container_name: web-56115

    ports:
      - "8015:5000"

    environment:
      ROLLNO: "56115"
      REDIS_HOST: cache

    networks:
      - net-56115


  cache:
    image: redis:alpine

    container_name: cache-56115

    command: redis-server --appendonly yes --dir /data

    volumes:
      - data-56115:/data

    networks:
      - net-56115


networks:

  net-56115:


volumes:

  data-56115:
